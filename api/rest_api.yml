openapi: 3.0.3
info:
  title: Social Network For Travellers - OpenAPI 3.0
  description: |-
    Для курса по System Design

    Some useful links:
    - [Repository](https://github.com/aaburkov/system-design-course)
    - [Course](https://balun.courses/courses/system_design)
  version: 1.0.0
tags:
  - name: posts
    description: Everything about Posts
  - name: comments
    description: Everything about Comments
  - name: reactions
    description: Everything about Reactions
paths:
  /posts:
    post:
      summary: Create a new post
      tags:
        - posts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPost'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /posts/{postId}:
    parameters:
      - name: postId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    put:
      summary: Update a post
      tags:
        - posts
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePost'
        required: true
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
    get:
      summary: Get a post by ID
      tags:
        - posts
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /comments:
    post:
      summary: Add a comment
      tags:
        - comments
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewComment'
        required: true
      responses:
        '200':
          description: Ok
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /comments/{postId}:
    get:
      summary: Get comments for a post
      tags:
        - comments
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Comment'
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /reactions:
    post:
      summary: Add or remove a reaction
      tags:
        - reactions
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewReaction'
        required: true
      responses:
        '200':
          description: Ok
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /reactions/{postId}:
    get:
      summary: Get reactions for a post
      tags:
        - reactions
      parameters:
        - name: postId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Reaction'
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /subscriptions:
    post:
      summary: Subscribe to a user
      tags:
        - users
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewSubscription'
        required: true
      responses:
        '200':
          description: Ok
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error
  /feed:
    get:
      summary: Get user feed
      tags:
        - feed
      responses:
        '200':
          description: Ok
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Post'
        '401':
          description: Access Denied
        '400':
          description: Bad Request
        '500':
          description: Server Error

components:
  schemas:
    NewPost:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        placeId:
          type: string
          format: uuid
        content:
          type: string
        photos:
          type: array
          items:
            type: string
            format: uuid
    UpdatePost:
      type: object
      properties:
        content:
          type: string
        photos:
          type: array
          items:
            type: string
            format: uuid
    NewComment:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        message:
          type: string
    NewReaction:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        reactionId:
          type: string
          format: uuid
    NewSubscription:
      type: object
      properties:
        userId:
          type: string
          format: uuid
        targetUserId:
          type: string
          format: uuid
    Post:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        placeId:
          type: string
          format: uuid
        content:
          type: string
        photos:
          type: array
          items:
            type: string
            format: uuid
    Comment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        message:
          type: string
    Reaction:
      type: object
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        postId:
          type: string
          format: uuid
        reactionId:
          type: string
          format: uuid
